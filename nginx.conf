server {
    listen 5013;
    listen [::]:5013;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression for fast cockpit & audio engine loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Allow Web Geolocation API (for EV GPS Speed Sync), Web Audio API Autoplay & Fullscreen
    add_header Permissions-Policy "geolocation=(self), autoplay=(self), fullscreen=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Lightweight healthcheck endpoint for Docker Compose
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Long-term cache for Vite hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
